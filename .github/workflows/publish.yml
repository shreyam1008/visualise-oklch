name: Publish Extension

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.event.release.tag_name || github.sha }}
      cancel-in-progress: false
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          }

      - name: Package extension
        run: bunx @vscode/vsce package --no-dependencies --out visualise-oklch-${{ steps.version.outputs.value }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: visualise-oklch-vsix
          path: visualise-oklch-${{ steps.version.outputs.value }}.vsix

      - name: Attach VSIX to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: visualise-oklch-${{ steps.version.outputs.value }}.vsix

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'release' && env.VSCE_PAT != ''
        run: bun run publish:marketplace

      - name: Publish to Open VSX Registry
        if: github.event_name == 'release' && env.OVSX_PAT != ''
        run: bun run publish:openvsx
